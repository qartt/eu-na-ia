name: Check-up de presença

on:
  push:
    branches: [main]
    paths: ['perfil.yml']
  schedule:
    - cron: '0 9 1 * *'   # todo dia 1, às 6h de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: checkup
  cancel-in-progress: false

jobs:
  checkup:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.rodar.outputs.publicar }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Rodar check-up
        id: rodar
        run: node src/cli.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      - name: Salvar resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Check-up de presença $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Preparar página
        if: steps.rodar.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pagina:
    needs: checkup
    if: needs.checkup.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true   # se o Pages não estiver ativado, o check-up continua valendo
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
